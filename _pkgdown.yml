url: https://nonprofit-open-data-collective.github.io/npmerger/
destination: docs

# The NODC site style (colours, fonts, navbar, light/dark switch) comes from
# the pkgstyle template package. Do not add bslib settings or
# pkgdown/extra.css here unless this site needs to differ.
template:
  package: pkgstyle

home:
  title: "npmerger: Nonprofit Merger Datasets from IRS 990 E-File Data"

navbar:
  structure:
    left: [intro, classifier, matching, reference, roadmap, news]
  components:
    intro:
      text: Overview
      href: articles/npmerger.html
    classifier:
      text: Classifier
      href: articles/classifier.html
    matching:
      text: Matching
      href: articles/matching.html
    roadmap:
      text: Roadmap
      href: https://github.com/Nonprofit-Open-Data-Collective/npmerger/blob/main/PLAN.md

reference:
- title: Run the whole pipeline
  desc: Build every merger table in one call, or try it offline on the bundled example.
  contents:
  - build_merger_data
  - npmerger_example
  - efile_years
- title: Retrieve Schedule N
  desc: Download Schedule N tables through panel990.
  contents:
  - get_schedule_n
  - sn_table_names
- title: Clean and stack transactions
  desc: Turn raw Schedule N tables into one row per asset line and one row per filing, and recover missing recipient EINs.
  contents:
  - sn_transactions
  - sn_filings
  - recover_recipient_ein
  - get_name_index
  - org_name_key
  - sn_flag
  - clean_ein
  - parse_irc_section
- title: Gather merger evidence
  desc: Read the 990 tables for the donors and recipients involved, and add leadership, multi-party, filing-history, corroboration, and affiliation evidence to each filing.
  contents:
  - get_evidence_tables
  - evidence_tables
  - merger_features
  - leader_overlap
  - add_donor_counts
  - add_filing_history
  - add_corroboration
  - add_affiliation
  - add_mission_similarity
  - person_key
  - merger_text_pattern
  - sn_merger_pattern
- title: Classify transactions
  desc: Label each filing as a merger, asset transfer, closure, disposition, or reorganization, using rules you can change.
  contents:
  - classify_transactions
  - merger_rules
  - transaction_types
  - sched_n_table
- title: Inspect the classifier
  desc: A tidy, labeled table of every Schedule N asset line with its checkboxes, and stratified samples of it for review by hand.
  contents:
  - sn_labeled
  - sn_inspection
  - sn_checkboxes
- title: Build merger cases
  desc: Donor-recipient pairs with merger IDs, each organization's merger year, and the value of assets transferred.
  contents:
  - build_merger_cases
  - merger_id
  - merger_roles
  - transfer_value
  - asset_class
- title: Core financial data
  desc: Read core 990 tables for merger organizations and build harmonized 990 / 990-EZ organization-years.
  contents:
  - get_core
  - core_tables
  - org_years
  - merger_measures
  - get_bmf
- title: Analysis tables
  desc: Donor and recipient attributes, the Part VII panel, and the fiscal-health panel around each merger.
  contents:
  - merger_attributes
  - merger_part7
  - merger_fiscal_panel
  - smooth_trailing
- title: Outcome measures
  desc: Measures from the merger and financial-vulnerability literatures beyond the 'fiscal' ratios, such as revenue concentration, growth, volatility, deficit history, Tuckman-Chang flags, and a combined donor + recipient pre-merger baseline.
  contents:
  - revenue_hhi
  - trend_measures
  - tuckman_chang
  - merger_proforma
- title: Matched comparison samples
  desc: Build the full 990 panel, a research sample of mergers with a full observation window, and candidate comparison organizations for merger recipients.
  contents:
  - build_match_data
  - match_coverage
  - get_panel
  - panel_columns
  - panel_measures
  - merger_sample
  - schedule_n_events
  - match_pool
  - match_candidates
  - match_balance
  - ntee_level
  - legacy_ntee
  - fill_ntee
  - real_dollars
  - cpi_u
- title: Package
  contents:
  - npmerger-package
